<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMargin · réplica web</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Colores tal como están en MainActivity.kt (TXT/DIM/DIM2 de MainActivity son más claros
   que los de Bienvenida/AutopistasActivity; se respeta cada pantalla con los suyos). */
:root{
  --bg:#12141A; --surface:#1B1E27; --surface2:#242835; --line:#2E3340;
  --txt:#E3DFD6; --titulo:#C0C9D8; --dim:#B4BBC9; --dim2:#A2ABBC;
  --brand:#F2B945; --brand-dim:#C9973A; --brand-wash:#2A2113; --sobre:#151107;
  --info:#5B8FD6; --bueno:#4FAE7C; --malo:#E0705F; --medio:#C97A32;
  /* Bienvenida / Mis autopistas / Historial de Uber */
  --txt-b:#D0CBC1; --dim-b:#9BA1B0; --dim2-b:#8A93A6;
  --mono: ui-monospace, "Roboto Mono", "Droid Sans Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0b0e;color:var(--txt);font-family:"Work Sans",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.banner{width:100%;background:var(--brand);color:var(--sobre);font:700 13px/1.3 "Work Sans",sans-serif;text-align:center;padding:6px 16px}
.banner a{color:var(--sobre)}
.phone{position:relative;width:412px;max-width:100%;height:calc(100vh - 44px);max-height:915px;margin:10px 0;background:var(--bg);border:1px solid #333;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){.phone{width:100%;height:calc(100vh - 30px);max-height:none;margin:0;border:0;border-radius:0}}
.pila{flex:1;position:relative;overflow:hidden}
.pantalla{position:absolute;inset:0;overflow-y:auto;background:var(--bg);display:none;scrollbar-width:thin}
.pantalla.on{display:block}
.cuerpo{padding:28px 20px}
.mono{font-family:var(--mono)}
.b{font-weight:700}
.dim{color:var(--dim)} .dim2{color:var(--dim2)}
/* barra inferior */
.barra{display:flex;background:var(--surface);padding:9px 0 11px}
.barra button{flex:1;min-height:48px;background:none;border:0;color:var(--dim2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:"Work Sans",sans-serif}
.barra .ic{font:19px Roboto,"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;line-height:1.2}
.barra .nm{font-size:11px}
.barra button.on{color:var(--brand)} .barra button.on .nm{font-weight:700}
/* piezas */
.tituloP{font-size:29px;font-weight:700;color:var(--titulo)}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:14px 16px 16px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font:700 20px "Work Sans",sans-serif;color:var(--sobre);background:var(--brand);cursor:pointer;min-height:48px}
.btn.s2{background:var(--surface2);color:var(--txt)}
.btn.malo{background:var(--malo)}
.btn.ok{background:var(--bueno)}
.fila{display:flex;padding:3px 0;font-size:18.5px}
.fila .i{flex:1;color:var(--dim)} .fila .d{font-family:var(--mono)}
.rotG{font:700 16px "Work Sans";color:var(--dim2);letter-spacing:.1em;padding:0 4px 8px;margin-top:22px}
.colap{margin-top:12px}
.colap>button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:700 20px "Work Sans";color:var(--titulo);cursor:pointer}
.colap>.cont{margin-top:6px;display:none}
.colap.abierto>.cont{display:block}
.acento{margin-top:12px}
.acento .cab{display:flex;align-items:center;border-radius:12px;padding:12px 14px;cursor:pointer}
.acento .franja{width:4px;height:30px;border-radius:2px;margin-right:12px;flex:none}
.acento .tt{font:700 17px "Work Sans";letter-spacing:.08em}
.acento .rs{font-size:16.5px;color:var(--dim2);padding-top:3px}
.acento .fl{font-size:20px;padding-left:10px}
.acento .cont{margin-top:6px;display:none}
.acento.abierto .cont{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:9px 12px;border-radius:14px;background:var(--surface2);color:var(--dim);font-size:16.5px;border:0;cursor:pointer;font-family:"Work Sans"}
.chip.on{background:var(--brand);color:var(--sobre);font-weight:700}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:0;border-radius:12px;padding:10px 8px;font:700 19px "Work Sans";background:var(--surface2);color:var(--txt);cursor:pointer}
.seg button.on{background:var(--brand);color:var(--sobre)}
.viaje{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-top:8px;cursor:pointer}
.viaje:active{filter:brightness(1.15)}
.lbl{font:700 16px "Work Sans";color:var(--dim);letter-spacing:.06em}
.inp{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:10px 12px;color:var(--txt);font:21px var(--mono);margin-top:4px}
/* toast */
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#3a3d45;color:#fff;padding:10px 16px;border-radius:22px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1}
/* diálogo */
.velo{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
.velo.on{display:flex}
.dlg{background:#2b2e37;border-radius:24px;padding:22px 22px 12px;width:100%;max-height:90%;overflow:auto}
.dlg h3{font-size:22px;color:var(--txt);margin-bottom:12px}
.dlg p{font-size:16px;color:var(--dim);line-height:1.4;white-space:pre-line}
.dlg .acc{display:flex;justify-content:flex-end;gap:6px;margin-top:14px;flex-wrap:wrap}
.dlg .acc button{background:none;border:0;color:var(--brand);font:700 16px "Work Sans";padding:10px 12px;cursor:pointer}
/* borde overlay */
.bordeOv{position:absolute;inset:0;pointer-events:none;z-index:30;border:0 solid transparent;border-radius:28px;transition:border-width .2s}
@media (max-width:480px){.bordeOv{border-radius:0}}
.etiqOv{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:31;background:rgba(0,0,0,.85);color:#fff;font:700 19px "Work Sans";padding:12px 18px;border-radius:13px;border:9px solid;display:none;white-space:nowrap}
/* sub-pantallas (Activities) */
.sub{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;display:none}
.sub.on{display:block}
.volver{position:sticky;top:0;background:var(--bg);padding:10px 16px 0;z-index:2}
.volver button{background:none;border:0;color:var(--dim-b);font-size:16px;cursor:pointer;font-family:"Work Sans"}
</style>
</head>
<body>
<div class="banner">Réplica web de MyMargin v0.79.0 (datos de ejemplo) · <a href="../">volver</a></div>

<div class="phone" id="phone">
  <div class="pila" id="pila"></div>
  <nav class="barra" id="barra"></nav>
  <div class="bordeOv" id="bordeOv"></div>
  <div class="etiqOv" id="etiqOv"></div>
  <div class="velo" id="velo"><div class="dlg" id="dlg"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------- almacenamiento local SIEMPRE envuelto (regla: nunca directo) ---------- */
function leerLocal(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function guardarLocal(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }

/* ---------- utilidades ---------- */
var C={bg:'#12141A',surface:'#1B1E27',surface2:'#242835',line:'#2E3340',txt:'#E3DFD6',titulo:'#C0C9D8',
  dim:'#B4BBC9',dim2:'#A2ABBC',brand:'#F2B945',brandDim:'#C9973A',info:'#5B8FD6',bueno:'#4FAE7C',malo:'#E0705F',medio:'#C97A32'};
function clp(n){ var s=Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'); return (n<0?'-$':'$')+s; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function tinte(hex,a){ var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16); return 'rgba('+r+','+g+','+b+','+(a/255).toFixed(3)+')'; }
var toastT;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg||'Solo en la app Android'; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},2200); }
function nativo(){ toast('Solo en la app Android'); }
function dialogo(titulo,cuerpoHtml,botones){
  var d=document.getElementById('dlg');
  d.innerHTML='<h3>'+esc(titulo)+'</h3>'+cuerpoHtml+'<div class="acc"></div>';
  var acc=d.querySelector('.acc');
  (botones||[['Cerrar',null]]).forEach(function(b){ var x=document.createElement('button'); x.textContent=b[0];
    x.onclick=function(){ cerrarDlg(); if(b[1]) b[1](); }; acc.appendChild(x); });
  document.getElementById('velo').classList.add('on');
}
function cerrarDlg(){ document.getElementById('velo').classList.remove('on'); }
document.getElementById('velo').addEventListener('click',function(e){ if(e.target.id==='velo') cerrarDlg(); });

function fila(i,d,color){ return '<div class="fila"><span class="i">'+esc(i)+'</span><span class="d" style="color:'+(color||C.txt)+'">'+esc(d)+'</span></div>'; }
function colapsable(rotulo,contenido){
  return '<div class="colap"><button data-r="'+esc(rotulo)+'" onclick="togColap(this)">'+esc(rotulo)+'   ▾</button><div class="cont">'+contenido+'</div></div>';
}
function togColap(b){ var w=b.parentNode; var ab=w.classList.toggle('abierto'); b.textContent=b.getAttribute('data-r')+'   '+(ab?'▴':'▾'); }
function seccionAcento(titulo,resumen,acento,contenido,abierta){
  return '<div class="acento'+(abierta?' abierto':'')+'"><div class="cab" onclick="togAcento(this)" style="background:'+tinte(acento,28)+';border:1px solid '+tinte(acento,90)+'">'+
    '<div class="franja" style="background:'+acento+'"></div><div style="flex:1"><div class="tt" style="color:'+acento+'">'+esc(titulo)+'</div>'+
    (resumen?'<div class="rs">'+esc(resumen)+'</div>':'')+'</div><div class="fl" style="color:'+acento+'">'+(abierta?'▾':'▸')+'</div></div><div class="cont">'+contenido+'</div></div>';
}
function togAcento(cab){ var w=cab.parentNode; var ab=w.classList.toggle('abierto'); cab.querySelector('.fl').textContent=ab?'▾':'▸'; }
function togSig(el,rotCerrado,rotAbierto){ var d=el.nextElementSibling; var ab=d.style.display==='block'; d.style.display=ab?'none':'block'; if(rotCerrado) el.innerHTML=ab?rotCerrado:rotAbierto; }

/* ---------- datos de ejemplo (inventados) ---------- */
var APP='UBER', PERIODO='HOY', SEMANA=0, FILTRO_AUT=null, FILTRO_AL=null;
var VIAJES=[
  {d:'vie 19',h:'23:42',asig:'23:36',fin:'00:04',com:'Providencia',bruto:6850,real:6850,liq:4480,km:9.4,min:22,nivel:'BUENO',modo:'MINUTO',conf:true,peajes:2},
  {d:'vie 19',h:'22:58',asig:'22:51',fin:'23:21',com:'Las Condes',bruto:7420,real:6910,liq:4190,km:12.1,min:23,nivel:'MEDIO',modo:'MINUTO',conf:true,peajes:3,foto:true},
  {d:'vie 19',h:'22:10',asig:'22:05',fin:'22:28',com:'Ñuñoa',bruto:4980,real:null,liq:3350,km:6.2,min:18,nivel:'BUENO',modo:'MINUTO',conf:true,peajes:0},
  {d:'vie 19',h:'21:31',asig:'21:26',fin:'21:44',com:'Santiago',bruto:3120,real:3120,liq:1890,km:5.8,min:13,nivel:'MALO',modo:'MINUTO',conf:false,peajes:0},
  {d:'vie 19',h:'21:02',asig:'',fin:'',com:'Vitacura',bruto:0,real:5640,liq:3900,km:0,min:0,nivel:'RECUPERADO',modo:'MINUTO',conf:null,peajes:0}
];
var ALERTAS=[
  {dias:1,fecha:'17 sept 2026 · 23:15',port:3,aut:'Costanera Norte + Vespucio Sur',cobro:2946,abono:1180,reclamado:null,
   cruces:[['23:21','P6 Kennedy','Costanera Norte',1104],['23:29','P3 La Florida','Vespucio Sur',921],['23:34','P5 Macul','Vespucio Sur',921]]},
  {dias:4,fecha:'14 sept 2026 · 01:08',port:2,aut:'Vespucio Norte',cobro:1780,abono:0,reclamado:null,
   cruces:[['01:14','PA2 Quilicura','Vespucio Norte',890],['01:19','PA4 Renca','Vespucio Norte',890]]},
  {dias:8,fecha:'11 sept 2026 · 22:40',port:1,aut:'Américo Vespucio Oriente',cobro:1210,abono:600,reclamado:'12 sept',
   cruces:[['22:52','Pórtico Príncipe de Gales','Américo Vespucio Oriente',1210]]}
];
var TRANSITOS=[
  ['19 sept','23:48','P6 Kennedy','Costanera Norte',1104,true],
  ['19 sept','23:55','P2 Tobalaba','Costanera Norte',860,false],
  ['19 sept','23:05','P3 La Florida','Vespucio Sur',921,true],
  ['19 sept','23:11','P5 Macul','Vespucio Sur',921,true],
  ['19 sept','23:16','Pórtico Príncipe de Gales','Américo Vespucio Oriente',1210,false],
  ['18 sept','20:02','PA2 Quilicura','Vespucio Norte',890,true],
  ['18 sept','20:07','PA4 Renca','Vespucio Norte',890,true]
];

/* ---------- pestañas ---------- */
var PESTANAS=[['⌂','Inicio'],['≡','Viajes'],['⚠','Alertas'],['⚖','Auditoría'],['ᯤ','TAG'],['⚙','Ajustes']];
var pila=document.getElementById('pila'), barra=document.getElementById('barra');
PESTANAS.forEach(function(p,i){
  var s=document.createElement('div'); s.className='pantalla'; s.id='p'+i; pila.appendChild(s);
  var b=document.createElement('button'); b.innerHTML='<span class="ic">'+p[0]+'</span><span class="nm">'+p[1]+'</span>';
  b.onclick=function(){ irAPestana(i); }; barra.appendChild(b);
});
function irAPestana(i){
  document.querySelectorAll('.pantalla').forEach(function(s,n){ s.classList.toggle('on',n===i); });
  barra.querySelectorAll('button').forEach(function(b,n){ b.classList.toggle('on',n===i); });
  [pintarInicio,pintarViajes,pintarAlertas,pintarAuditoria,pintarTag,pintarAjustes][i]();
  document.getElementById('p'+i).scrollTop=0;
  guardarLocal('mm_pestana',String(i));
}
function nombreApp(){ return APP==='DIDI'?'DiDi':APP==='CABIFY'?'Cabify':'Uber'; }

/* ---------- INICIO ---------- */
var ENCENDIDO=false;
function pintarInicio(){
  var marcas=[['UBER','Uber','#000000','900'],['DIDI','DiDi','#FF7A29','700'],['CABIFY','Cabify','#653CAD','700']];
  var sel='<div style="display:flex;gap:8px;margin-top:16px">'+marcas.map(function(m){
    var act=m[0]===APP; var tinta=act?(m[0]==='DIDI'?'#151107':C.txt):C.txt;
    return '<div onclick="APP=\''+m[0]+'\';pintarInicio()" style="flex:1;cursor:pointer;text-align:center;border-radius:14px;padding:11px 4px 9px;opacity:'+(act?1:.9)+';background:'+(act?m[2]:C.surface2)+';border:2px solid '+(act?C.txt:m[2])+'">'+
      '<div style="font:'+m[3]+' 22px Roboto,Arial,sans-serif;color:'+tinta+'">'+m[1]+'</div><div style="font-size:15.5px;padding-top:1px;color:'+(act?tinta:C.dim)+'">'+(act?'● Activa':'Tocar')+'</div></div>';
  }).join('')+'</div>';
  var n=APP==='UBER'?4:0;
  var dash='<div class="tarjeta pad" style="margin-top:10px"><div class="b" style="font-size:16px;color:'+C.dim+';letter-spacing:.08em">HOY · '+nombreApp()+' · '+n+' viaje'+(n===1?'':'s')+'</div>'+
    '<div style="display:flex;padding:4px 0 10px">'+
    ['BRUTO|'+clp(n?22370:0)+'|Uber','LÍQUIDA|'+clp(n?13910:0)+'|te queda'].map(function(x){x=x.split('|');
      return '<div style="flex:1"><div class="b" style="font-size:15px;color:'+C.dim+';letter-spacing:.1em">'+x[0]+'</div><div class="mono" style="font-size:26px;color:'+C.txt+'">'+x[1]+'</div><div style="font-size:15.5px;color:'+C.dim+'">'+x[2]+'</div></div>';}).join('')+
    '</div>'+fila('$ por hora',clp(n?10840:0)+'/h',C.brand)+fila('Confirmados por Uber',(n?3:0)+'/'+n,n?C.dim:C.txt)+'</div>';
  document.getElementById('p0').innerHTML='<div class="cuerpo">'+
    '<div class="b" style="font-size:31px;color:'+C.txt+'">MyMargin</div><div style="font-size:18px;color:'+C.dim+'">Auditor de viajes</div>'+
    sel+dash+
    '<button class="btn '+(ENCENDIDO?'ok':'')+'" style="margin-top:14px" onclick="ENCENDIDO=!ENCENDIDO;pintarInicio();toast(ENCENDIDO?\'Simulado: en el teléfono pide 2 permisos\':\'Apagado\')">'+(ENCENDIDO?'● Encendido — tocar para apagar':'Encender Auditor')+'</button>'+
    '<div style="font-size:17.5px;color:'+C.dim+';margin-top:8px">Un toque y listo: enciende el borde de color y la lectura de la app seleccionada arriba. Pedirá 2 permisos la primera vez (superposición y grabar pantalla).</div>'+
    '<button onclick="nativo()" style="margin-top:14px;width:100%;min-height:50px;background:transparent;border:1px solid '+C.brand+';border-radius:12px;color:'+C.brand+';font:700 20px Work Sans;cursor:pointer">⟳  Sincronizar</button>'+
    '<div style="font-size:17px;color:'+C.dim+';margin-top:5px">Trae tus peajes de todas las autopistas y te deja en Ganancias de Uber.</div>'+
    '<div class="tarjeta pad" style="margin-top:22px;border-style:dashed"><div class="lbl" style="letter-spacing:.1em">DEMO DE LA RÉPLICA (no existe en la app)</div>'+
    '<div style="font-size:16px;color:'+C.dim2+';margin:6px 0 10px">Así se ve el borde de color que pinta OverlayService sobre la app de Uber al leer una oferta.</div>'+
    '<div class="seg"><button style="background:#39FF14;color:#111" onclick="demoBorde(\'BUENO\')">Verde</button><button style="background:#FF9500;color:#111" onclick="demoBorde(\'MEDIO\')">Naranjo</button><button style="background:#FF1744;color:#fff" onclick="demoBorde(\'MALO\')">Rojo</button></div>'+
    '<button class="btn s2" style="margin-top:10px;font-size:17px" onclick="abrirSub(\'bienvenida\')">Ver la Bienvenida (primer arranque)</button></div>'+
    '</div>';
}
var bordeT;
function demoBorde(n){
  var col={BUENO:'#39FF14',MEDIO:'#FF9500',MALO:'#FF1744'}[n];
  var txt={BUENO:'ACÉPTALO · $312/min',MEDIO:'REGULAR · $228/min',MALO:'DÉJALO PASAR · $141/min'}[n];
  var b=document.getElementById('bordeOv'), e=document.getElementById('etiqOv');
  b.style.borderColor=col; b.style.borderWidth='12px'; e.style.borderColor=col; e.textContent=txt; e.style.display='block';
  clearTimeout(bordeT); bordeT=setTimeout(function(){ b.style.borderWidth='0'; e.style.display='none'; },4000);
}

/* ---------- VIAJES ---------- */
function filaViaje(v,i){
  var color={BUENO:C.bueno,MEDIO:C.medio,RECUPERADO:C.dim,INDETERMINADO:C.dim}[v.nivel]||C.malo;
  var marca=v.conf===true?'✓ ':v.conf===false?'? ':'';
  var rec=v.nivel==='RECUPERADO';
  var hor=(v.asig?'asignado '+v.asig+' · ':'')+'inicio '+v.h+(v.min>0?' · fin '+v.fin:'')+(v.peajes>0?' · '+v.peajes+' peaje(s)':'');
  var ruta=rec?'sin datos de ruta — monto tomado de Uber':(String(v.km)+' km · '+v.min+' min · '+Math.round(v.bruto/v.min)+'/min · '+clp(v.bruto/v.min*60)+'/h');
  var modo=rec?'recuperado (la app no vio este viaje)':'validado por MINUTO';
  var est,estC;
  if(v.real==null){ est='≈ estimado de la oferta — tocá para corregir'; estC=C.dim; }
  else if(rec||v.real===v.bruto){ est='✓ pagaron lo ofertado'; estC=C.bueno; }
  else if(v.real<v.bruto){ est='⚠ te pagaron '+clp(v.bruto-v.real)+' MENOS de lo ofertado ('+Math.round((v.real-v.bruto)/v.bruto*100)+'%)'; estC=C.malo; }
  else { est='↑ pagaron '+clp(v.real-v.bruto)+' más que la oferta'; estC=C.bueno; }
  return '<div class="viaje" onclick="fichaViaje('+i+')">'+fila(marca+v.d+' · '+v.h,v.com,C.txt)+
    '<div style="font-size:16px;color:'+C.dim+';padding-top:2px">'+hor+'</div>'+
    fila(clp(rec?v.real:v.bruto)+(v.real!=null&&!rec?'  (real '+clp(v.real)+')':''),'líq '+clp(v.liq),color)+
    (v.foto?'<div style="font-size:18px;color:'+C.brand+';padding:6px 0 2px" onclick="event.stopPropagation();verOferta('+i+')">📷  Ver la oferta que me mostraron</div>':'')+
    '<div class="mono" style="font-size:17.5px;color:'+C.dim+';padding-top:2px">'+ruta+'</div>'+

 ['MyMargin guarda las pruebas de tus viajes','Mientras manejas, te dice si una oferta conviene.\n\nY guarda la evidencia de cada viaje, para cuando tengas que reclamarle a Uber un pago que falta.','Empezar'],
 ['Para leer las ofertas, necesita ver tu pantalla','Lee el monto, los minutos y los kilómetros de la tarjeta de Uber, y guarda una foto de la oferta que aceptaste.\n\nLas capturas se quedan en tu teléfono. No se suben a ningún servidor: tú decides cuáles compartir, y cuándo.\n\nNo se guarda la pantalla del código PIN ni tus conversaciones con el pasajero.','Dar permiso','Ahora no'],
 ['Al terminar el turno, se sincroniza con Uber','La app compara lo que registró con lo que Uber declara haber pagado.\n\nUber no permite que otra app entre a su historial. Por eso el botón Sincronizar abre Uber, tú tocas "Ganancias", y la app lee lo que aparece en pantalla.\n\nSon unos segundos. Sin eso, tus viajes quedan con el monto estimado de la oferta y no se puede detectar un pago que falte.','Entendido'],
 ['Tus peajes se traen de cada autopista','MyMargin entra a la oficina virtual de cada concesionaria con TU cuenta, la misma que usas tú, y baja tus cruces de pórtico.\n\nLa primera vez entras a mano, en el sitio de la concesionaria. Si quieres que después se sincronice sola, puedes guardar la clave: queda cifrada con el llavero del teléfono y no sale de aquí. Si prefieres no guardarla, la app conserva solo la sesión y tú entras cuando toque.\n\nSe conectan desde Ajustes › Mis autopistas.','Entendido'],
 ['Qué se guarda, y por cuánto','Solo se guarda lo que sirve para probar: la foto de la oferta, la hora, la dirección, la duración y los montos.\n\nNo se guarda el código PIN del pasajero ni tus conversaciones con él. Nada se sube a internet.\n\nLas pruebas se borran dos semanas después de que el viaje quedó conciliado. Un viaje que estés reclamando no se borra hasta que lo cierres.\n\nPuedes borrar cualquier viaje cuando quieras, desde su ficha.','Acepto'],
 ['Listo','Enciende MyMargin cuando empieces a manejar.\n\nEl borde de la pantalla se pinta con el veredicto de cada oferta: verde conviene, naranja límite, rojo no.\n\nHoy funciona con Uber. DiDi y Cabify vienen después.','Encender']];
crearSub('bienvenida','<div id="bienv" style="min-height:100%;display:flex;flex-direction:column;padding:40px 24px 24px"></div>');
function pasoBienvenida(i){
  var p=PASOS[i];
  document.getElementById('bienv').innerHTML='<div style="display:flex;gap:6px">'+PASOS.map(function(_,n){return '<div style="flex:1;height:4px;border-radius:3px;background:'+(n<=i?C.brand:'#2E3340')+'"></div>';}).join('')+'</div>'+
   '<div style="font:700 27px Roboto,Arial,sans-serif;color:var(--txt-b);padding:26px 0 14px">'+p[0]+'</div>'+
   '<div style="flex:1;font-size:19px;color:var(--dim-b);white-space:pre-line;line-height:1.35">'+p[1]+'</div>'+
   '<button onclick="'+(i<PASOS.length-1?(i===1?'toast(\'Solo en la app Android\');':'')+'pasoBienvenida('+(i+1)+')':'cerrarSub(\'bienvenida\')')+'" style="margin-top:24px;width:100%;min-height:52px;border:0;border-radius:10px;background:var(--brand);color:#151107;font:700 20px Roboto,Arial,sans-serif;cursor:pointer">'+p[2]+'</button>'+
   (p[3]?'<button onclick="pasoBienvenida('+(i+1)+')" style="margin-top:8px;width:100%;min-height:48px;border:0;background:transparent;color:var(--dim-b);font:18px Roboto,Arial,sans-serif;cursor:pointer">'+p[3]+'</button>':'');
}
